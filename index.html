<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title> Admin Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- Login Page CSS -->
    <link rel="stylesheet" href="css/login-page.css">
</head>
<body>

    <div class="login-container">
        <div class="glass-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="church-icon">
                    <!-- CHANGED: Using the same emblem as index page -->
                    <img src="images/emblem.png" alt="Church Emblem" class="church-emblem">
                </div>
                <h1>Welcome</h1>
                <p>Statistics Management System</p>
            </div>

            <!-- Message Alert -->
            <div id="loginMessage" style="display: none;" class="alert-message"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <div class="input-group-custom">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="form-control-glass" placeholder="Username" autocomplete="off" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group-custom">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-control-glass" placeholder="Password">
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login to Dashboard</span>
                </button>
            </form>

            <!-- Demo Credentials Hint -->
            <div class="demo-hint">
                <i class="fas fa-info-circle"></i> Login with your <strong>Username</strong> and <strong>Password</strong>
            </div>

            <div class="login-footer">
                <p>&copy; 2025 All Rights Reserved</p>
            </div>
        </div>
    </div>

    <!-- Scripts - ORDER MATTERS! -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.public.js"></script>
<script src="js/api-client.js"></script>
<script src="js/login-page.js"></script>
</body>
</html>
